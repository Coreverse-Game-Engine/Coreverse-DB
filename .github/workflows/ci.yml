name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  # ---------------------------------------------------------------------
  # openapi/ is the API contract. Lint it independently so a broken
  # contract fails fast, before client generation is attempted.
  # ---------------------------------------------------------------------
  openapi-lint:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI version
        shell: bash
        run: |
          set -euo pipefail

          expected="3.1.0"
          actual="$(sed -n 's/^openapi:[[:space:]]*//p' openapi/openapi.yaml | head -n 1)"

          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: openapi/openapi.yaml must declare OpenAPI $expected."
            echo "Found: ${actual:-<missing>}"
            exit 1
          fi

          echo "OpenAPI version: $actual"

      - name: Redocly lint
        run: pnpm exec redocly lint openapi/openapi.yaml

  # ---------------------------------------------------------------------
  # The generated client must always match what Orval would produce from
  # the current openapi/** contract.
  #
  # `pnpm run verify` is expected to:
  #   1. generate the client
  #   2. fail on git diff
  #   3. run TypeScript typechecking
  # ---------------------------------------------------------------------
  client-verify:
    name: Verify generated client (no drift) + typecheck
    runs-on: ubuntu-latest
    needs: openapi-lint

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI version
        shell: bash
        run: |
          set -euo pipefail

          expected="3.1.0"
          actual="$(sed -n 's/^openapi:[[:space:]]*//p' openapi/openapi.yaml | head -n 1)"

          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: openapi/openapi.yaml must declare OpenAPI $expected."
            echo "Found: ${actual:-<missing>}"
            exit 1
          fi

          echo "OpenAPI version: $actual"

      - name: Verify generated client
        run: pnpm run verify

      - name: Show generated client diff on failure
        if: failure()
        shell: bash
        run: |
          git diff -- src/generated | head -c 20000

  # ---------------------------------------------------------------------
  # Vitest unit tests for the hand-written src/ files (src/client/http.ts,
  # src/react.ts, src/index.ts). src/generated/** itself is NOT unit-tested
  # here -- it's Orval output, already covered by client-verify's
  # generate -> git diff -> typecheck above. src/index.ts and src/react.ts
  # are pure `export * from "./generated/..."` barrels though, so they
  # still need `pnpm run generate` to have run before they can even be
  # imported -- see tests/index.test.ts and tests/react.test.ts.
  # ---------------------------------------------------------------------
  vitest-unit:
    name: Vitest unit tests (client/http, react, index)
    runs-on: ubuntu-latest
    needs: openapi-lint

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate client (src/index.ts / src/react.ts import from src/generated/**)
        run: pnpm run generate

      - name: Run vitest
        run: pnpm run test

  # ---------------------------------------------------------------------
  # Pure Deno unit tests for Edge Function Zod schemas.
  # No Supabase/PostgreSQL dependency.
  # ---------------------------------------------------------------------
  deno-unit:
    name: Deno unit tests (Zod schemas)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno tests
        run: deno task test

      - name: Check Deno formatting
        run: deno fmt --check supabase/functions/

  # ---------------------------------------------------------------------
  # pgTAP tests run against a real local Supabase/PostgreSQL stack.
  #
  # This is deliberately separate from deno-unit because pgTAP tests
  # the database itself and requires Docker + PostgreSQL.
  # ---------------------------------------------------------------------
  supabase-pgtap:
    name: Supabase pgTAP tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Lint database schema
        run: supabase db lint

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ---------------------------------------------------------------------
  # Single required status check for branch protection.
  # ---------------------------------------------------------------------
  ci-required:
    name: CI required checks
    if: always()
    runs-on: ubuntu-latest

    needs:
      - openapi-lint
      - client-verify
      - vitest-unit
      - deno-unit
      - supabase-pgtap

    steps:
      - name: Fail if any dependency failed or was cancelled
        shell: bash
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi

          echo "All required CI jobs passed."
