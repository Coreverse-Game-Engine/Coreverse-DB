name: Publish package

# Manually triggered by pushing a version tag (e.g. `v0.2.0`) after
# bumping the version locally with `pnpm version` -- not run on every
# merge to main. CI never writes the version itself: it only checks that
# the pushed tag matches what's already committed in package.json, then
# builds and publishes exactly that.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.4.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@coreverse"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast if someone tags a version that doesn't match what's
      # actually committed in package.json -- CI does not bump/write the
      # version itself, that's done locally via `pnpm version` before the
      # tag is pushed.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "ERROR: tag v$tag_version does not match package.json version $pkg_version."
            echo "Bump the version locally with 'pnpm version' and push a matching tag."
            exit 1
          fi

          echo "Tag matches package.json version: $pkg_version"

      # Same drift + typecheck gate as ci.yml, run again here as a
      # publish-time safety net (a tag can in principle be pushed from any
      # commit, not only one that already passed CI on main).
      - name: Verify generated client (no drift) + typecheck
        run: pnpm run verify

      - name: Build (tsup)
        run: pnpm run build

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
