name: Docs

on:
  push:
    branches: [docs]

# Only one docs deployment should run/land at a time.
concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build mdBook and deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          mkdir -p "${HOME}/.cargo/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "${HOME}/.cargo/bin"
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build book
        working-directory: docs
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/book
          publish_branch: gh-pages
