limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  description: Max items to return (1-100, default 20).

cursor:
  name: cursor
  in: query
  required: false
  schema:
    type: string
  description: >
    Opaque token from a previous page's next_cursor. Omit for the first
    page. Treat as opaque -- its encoding is an implementation detail
    and may change.
