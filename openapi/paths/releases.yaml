list:
  get:
    summary: List engine releases
    operationId: listReleases
    tags: [releases]
    security: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [stable, beta, rc, deprecated]
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
    responses:
      '200':
        description: A page of releases, newest first.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/Release.yaml'
      '400':
        description: Invalid query parameters.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

latest:
  get:
    summary: Get the latest release for a status channel
    operationId: getLatestRelease
    tags: [releases]
    security: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [stable, beta, rc, deprecated]
          default: stable
    responses:
      '200':
        description: The latest matching release.
        content:
          application/json:
            schema:
              $ref: '../schemas/Release.yaml'
      '404':
        description: No release found for the given status.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

byVersion:
  get:
    summary: Get a release by exact version
    operationId: getReleaseByVersion
    tags: [releases]
    security: []
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
    responses:
      '200':
        description: The matching release.
        content:
          application/json:
            schema:
              $ref: '../schemas/Release.yaml'
      '400':
        description: Malformed version string (expected MAJOR.MINOR.PATCH).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No release found for the given version.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

delta:
  get:
    summary: Plan a delta update from an older release to this one
    description: >
      Used by the Launcher to update an installed Engine version without
      downloading the full artifact. Returns the target's file manifest
      and an ordered chain of delta packages (oldest first) that turns
      `from` into `{version}`, or `recommended: full` with a `reason`
      when a full download is the better choice (no chain of at most
      `max_steps` deltas, the chain is larger than `max_ratio` of the
      full artifact, the target has no manifest yet, or `from` is not
      older than the target). `steps` is empty unless `recommended` is
      `delta`. `full` is always present so a failed delta update can fall
      back to the full artifact, verified with its `sha256`.
    operationId: getReleaseDeltaPlan
    tags: [releases]
    security: []
    parameters:
      - name: version
        in: path
        required: true
        description: The target version (the one to update to).
        schema:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
      - name: from
        in: query
        required: true
        description: The installed version to update from.
        schema:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
      - name: os
        in: query
        required: true
        schema:
          type: string
          enum: [windows, linux, macos]
      - name: architecture
        in: query
        required: true
        schema:
          type: string
          enum: [x86_64, arm64]
    responses:
      '200':
        description: The update plan.
        content:
          application/json:
            schema:
              $ref: '../schemas/DeltaPlan.yaml'
      '400':
        description: Malformed version, or a missing or invalid query parameter.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: Unknown target or source release, or no artifact for the platform on the target.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
