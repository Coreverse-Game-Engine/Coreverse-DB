list:
  get:
    summary: List news (published only, unless moderator or author)
    operationId: listNews
    tags: [news]
    security:
      - {}
      - bearerAuth: []
    description: >
      Anonymous and unrelated callers only see status=published. An
      authenticated caller who is the item's author or a platform
      moderator/admin also sees their own drafts (RLS: news_authenticated_read).
    parameters:
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [draft, published] }
      - $ref: '../parameters/Pagination.yaml#/limit'
      - $ref: '../parameters/Pagination.yaml#/cursor'
    responses:
      '200':
        description: A page of news items, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [items, next_cursor]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../schemas/News.yaml'
                next_cursor:
                  type: string
                  nullable: true
                  description: Pass as ?cursor= to fetch the next page. null once there are no more.
      '400':
        description: Invalid status filter, limit, or cursor.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  post:
    summary: Create a news item as a draft (moderator/admin only)
    operationId: createNews
    tags: [news]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, slug, body]
            properties:
              title: { type: string }
              slug: { type: string }
              body: { type: string }
              summary: { type: string, nullable: true }
              cover_image_path:
                type: string
                nullable: true
                description: >
                  Storage path in the news-covers bucket
                  (moderator/admin-write only). Resolved to
                  cover_image_url in the response.
    responses:
      '201':
        description: Created (draft) news item.
        content:
          application/json:
            schema:
              $ref: '../schemas/News.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a moderator/admin.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: A news item with that slug already exists.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'

byId:
  get:
    summary: Fetch one news item, by id or by slug
    operationId: getNews
    tags: [news]
    security:
      - {}
      - bearerAuth: []
    description: >
      Same visibility as the list endpoint (RLS: published is public; a
      draft is visible to its author or a moderator/admin).
    parameters:
      - name: newsId
        in: path
        required: true
        schema: { type: string }
        description: >
          Either the item's uuid id, or its slug (Website's article URLs
          are slug-based). PATCH/DELETE below only accept the uuid id.
    responses:
      '200':
        description: The news item.
        content:
          application/json:
            schema:
              $ref: '../schemas/News.yaml'
      '404':
        description: No news item with that id or slug (or not authorized to see it).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  patch:
    summary: Update a news item, e.g. to publish it (moderator/admin only)
    operationId: updateNews
    tags: [news]
    security:
      - bearerAuth: []
    parameters:
      - name: newsId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              body: { type: string }
              summary: { type: string, nullable: true }
              cover_image_path: { type: string, nullable: true }
              status: { type: string, enum: [draft, published] }
    responses:
      '200':
        description: Updated news item.
        content:
          application/json:
            schema:
              $ref: '../schemas/News.yaml'
      '400':
        description: Invalid news id or request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '403':
        description: Caller is not a moderator/admin.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No news item with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Delete a news item (moderator/admin only)
    operationId: deleteNews
    tags: [news]
    security:
      - bearerAuth: []
    parameters:
      - name: newsId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: Deleted.
      '400':
        description: Invalid news id.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No news item with that id (or not authorized).
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
