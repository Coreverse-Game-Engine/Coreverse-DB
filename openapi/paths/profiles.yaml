me:
  get:
    summary: Get the caller's own profile
    operationId: getMyProfile
    tags: [profiles]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: The caller's profile.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  patch:
    summary: Update the caller's own profile
    operationId: updateMyProfile
    tags: [profiles]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: At least one of full_name or username must be provided.
            properties:
              full_name:
                type: string
                minLength: 1
                maxLength: 100
              username:
                type: string
                minLength: 3
                maxLength: 24
                pattern: '^[a-zA-Z0-9_]+$'
                description: >
                  Must be unique (case-insensitive) across all profiles.
                  A taken username returns 409.
    responses:
      '200':
        description: The updated profile.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: Username is already taken, case-insensitive (error is "username_taken").
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Delete the caller's own account
    operationId: deleteMyAccount
    tags: [profiles]
    security:
      - bearerAuth: []
    description: >
      Deletes the Auth user and (via cascade) the profile row -- not
      reversible. Fails with 409 if the account still owns or authored
      content that isn't safe to silently delete or orphan (a team it
      sole-owns, news/events/discussions/discussion replies/FAQ items
      it authored, a project it owns); the response lists exactly which.
      Resolve each listed blocker (transfer ownership, delete the
      content, etc.) and retry.
    responses:
      '204':
        description: Deleted.
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: Account still owns or authored content (error is "account_has_content"); see `blockers`.
        content:
          application/json:
            schema:
              type: object
              required: [error, message, blockers]
              properties:
                error:
                  type: string
                  enum: [account_has_content]
                message:
                  type: string
                blockers:
                  type: array
                  items:
                    type: object
                    required: [reason, count]
                    properties:
                      reason:
                        type: string
                        enum:
                          - owns_teams
                          - owns_projects
                          - authored_news
                          - authored_events
                          - created_faq_items
                          - authored_discussions
                          - authored_discussion_replies
                      count:
                        type: integer
usernameAvailability:
  get:
    summary: Check whether a username is available
    operationId: checkUsernameAvailability
    tags: [profiles]
    description: >
      Public (no session required) -- a signed-out user picking a
      username at signup needs this too. Rate-limited per caller IP
      (30/min). If the caller does have a session, their own current
      username counts as available (re-checking the value already in
      an edit form must not report it as taken).
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 24
          pattern: '^[a-zA-Z0-9_]+$'
    responses:
      '200':
        description: Availability result.
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available:
                  type: boolean
      '400':
        description: username is missing or does not match the required format.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '429':
        description: Too many checks from this IP; retry after Retry-After seconds.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
avatar:
  post:
    summary: Upload the caller's own avatar
    description: >
      Accepts a multipart upload, validates it server-side (PNG or WebP,
      up to 5 MB), writes it to the avatars bucket with the service
      role, and updates the caller's avatar_path. Clients no longer
      write to Storage directly for this -- see
      20260912085602_avatar_upload_and_rate_limit.sql.
    operationId: uploadMyAvatar
    tags: [profiles]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: PNG or WebP image, up to 5 MB.
    responses:
      '200':
        description: The updated profile, including the new avatar_url.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '400':
        description: Missing file or unsupported file type.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '413':
        description: File exceeds the 5 MB limit.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Remove the caller's own avatar
    description: >
      Clears avatar_path and best-effort removes the underlying object
      from the avatars bucket. 404 if the profile has no avatar set.
    operationId: deleteMyAvatar
    tags: [profiles]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: The updated profile, with avatar_url now null.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found, or the profile has no avatar to remove.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
