me:
  get:
    summary: Get the caller's own profile
    operationId: getMyProfile
    tags: [profiles]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: The caller's profile.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  patch:
    summary: Update the caller's own profile
    operationId: updateMyProfile
    tags: [profiles]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: At least one of full_name or username must be provided.
            properties:
              full_name:
                type: string
                minLength: 1
                maxLength: 100
              username:
                type: string
                minLength: 3
                maxLength: 24
                pattern: '^[a-zA-Z0-9_]+$'
                description: >
                  Must be unique (case-insensitive) across all profiles.
                  A taken username returns 409.
    responses:
      '200':
        description: The updated profile.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '409':
        description: Username is already taken, case-insensitive (error is "username_taken").
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
avatar:
  post:
    summary: Upload the caller's own avatar
    description: >
      Accepts a multipart upload, validates it server-side (PNG or WebP,
      up to 5 MB), writes it to the avatars bucket with the service
      role, and updates the caller's avatar_path. Clients no longer
      write to Storage directly for this -- see
      20260912085602_avatar_upload_and_rate_limit.sql.
    operationId: uploadMyAvatar
    tags: [profiles]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: PNG or WebP image, up to 5 MB.
    responses:
      '200':
        description: The updated profile, including the new avatar_url.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '400':
        description: Missing file or unsupported file type.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '413':
        description: File exceeds the 5 MB limit.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  delete:
    summary: Remove the caller's own avatar
    description: >
      Clears avatar_path and best-effort removes the underlying object
      from the avatars bucket. 404 if the profile has no avatar set.
    operationId: deleteMyAvatar
    tags: [profiles]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: The updated profile, with avatar_url now null.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found, or the profile has no avatar to remove.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
