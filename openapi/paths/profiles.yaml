me:
  get:
    summary: Get the caller's own profile
    operationId: getMyProfile
    tags: [profiles]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: The caller's profile.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
  patch:
    summary: Update the caller's own profile
    operationId: updateMyProfile
    tags: [profiles]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: At least one of full_name or avatar_path must be provided.
            properties:
              full_name:
                type: string
                minLength: 1
                maxLength: 100
              avatar_path:
                type: string
                minLength: 1
                nullable: true
                description: >
                  Storage path in the avatars bucket. Set this directly
                  only if you already know a valid path (e.g. clearing
                  the avatar with null); to upload a new image, use
                  POST /profiles/me/avatar instead, which uploads the
                  file and sets this for you.
    responses:
      '200':
        description: The updated profile.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '400':
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
avatar:
  post:
    summary: Upload the caller's own avatar
    description: >
      Accepts a multipart upload, validates it server-side (PNG or WebP,
      up to 5 MB), writes it to the avatars bucket with the service
      role, and updates the caller's avatar_path. Clients no longer
      write to Storage directly for this -- see
      20260912085602_avatar_upload_and_rate_limit.sql.
    operationId: uploadMyAvatar
    tags: [profiles]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: PNG or WebP image, up to 5 MB.
    responses:
      '200':
        description: The updated profile, including the new avatar_url.
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '400':
        description: Missing file or unsupported file type.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '401':
        description: A valid session is required.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '404':
        description: No profile found for this user.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
      '413':
        description: File exceeds the 5 MB limit.
        content:
          application/json:
            schema:
              $ref: '../schemas/Error.yaml'
