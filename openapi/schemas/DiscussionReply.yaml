type: object
required:
  - id
  - discussion_id
  - author_id
  - author
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  discussion_id:
    type: string
    format: uuid
  author_id:
    type: string
    format: uuid
  author:
    $ref: './Author.yaml'
  body:
    type: string
    nullable: true
    description: null/omitted when deleted_at is set -- render as "[deleted]".
  deleted_at:
    type: string
    format: date-time
    nullable: true
  edited_at:
    type: string
    format: date-time
    nullable: true
    description: Set when body is edited. Distinct from deleted_at/updated_at -- see the Faz 3 migration.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
