type: object
required:
  - id
  - full_name
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  full_name:
    type: string
    description: Free-text display name, no format or uniqueness constraint. Distinct from username.
  username:
    type: string
    nullable: true
    description: >
      Unique (case-insensitive), alphanumeric/underscore handle, 3-24
      characters. Every profile has one in practice (assigned at signup,
      backfilled for pre-existing users), but it's nullable at the
      schema level rather than required.
  avatar_url:
    type: string
    format: uri
    nullable: true
    description: Public/signed URL resolved from the stored avatar_path, not the raw path itself.
  platform_role:
    type: string
    nullable: true
    enum: [admin, moderator, null]
    description: >
      Only present on GET /profiles/me (never on another user's
      profile) -- identity.platform_roles is self-only RLS. null means
      no elevated role.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
